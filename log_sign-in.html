<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    .first_img {
      width: 500px;
      height: 520px;
      border-top-right-radius: 300px;
      border-bottom-left-radius: 300px;
      padding: 100px;
    }

    .text {
      color: white;
      text-align: center;
      position: absolute;
      top: 40%;
      left: 30%;
    }

    .first {
      position: relative;
    }

    .buttons {
      display: flex;
      gap: 20px;
      padding-left: 15px;
    }

    .btn {
      display: flex;
      align-items: center;
      gap: 10px;

      padding: 10px 20px;
      border: 1px solid black;
      border-radius: 6px;

      background-color: white;
      color: #1a1a1a;
      font-size: 16px;
      cursor: pointer;
    }

    .btn img {
      width: 18px;
      padding-left: 15px;
    }

    .facebook i {
      color: #1877f2;
      padding-left: 15px;
    }

    .input-box {
      position: relative;
      display: flex;
      align-items: center;
      padding: 12px 30px;
      
     
      border-radius: 5px;
      width: 25%;
      background-color: rgba(217, 217, 217, 1);

    }

    .input-box input {

      width: 1000px;
      border: none;
      outline: none;
      background-color: transparent;
      font-size: 16px;
    }

    .input-box i {
      font-size: 18px;
      cursor: pointer;
      margin-right: 10px;
      color: black;
    }

    .whole {
      display: flex;

    }
    .yy{
      padding-top:120px;
      padding-left: 80px;
    }
    .hh{
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      
    }
    .hh span {
  flex: 0.1;
  height: 1px;
  background-color: #888;
}

.hh p {
  margin: 0;
  font-size: 14px;
  color: #333;
  white-space: nowrap;
}
.jj button{
  background-color: rgba(0, 53, 75, 1);
  width: 30%;
  padding: 15px;
  color: white;
  border-radius: 5px;
  font-size: 17px;
}
.t{
  padding-left: 50px;
}

.btn-link {
  display: inline-block;
  
  text-decoration: none;
  text-align: center;
  background-color: rgba(0, 53, 75, 1);
  width: 28%;
  color: white;
  padding: 15px;
  border-radius: 5px;
  font-size: 17px;
}


  </style>
</head>

<body>
  <div class="whole">
    <div class="first">
      <img src="signin_img.jpg" alt="" class="first_img">
      <div class="text">
        <h1>Let's Get Started!</h1>
        <p>Create your account and unlock the <br> full potential of Fragranzia.</p>
      </div>
    </div>

    <div class="yy">
      <div class="buttons">
        <button class="btn google"> <img src="https://developers.google.com/identity/images/g-logo.png">Google</button>
        <button class="btn facebook"> <i class="fa-brands fa-facebook-f"></i>Facebook</button>
      </div><br>
      <div class="hh">
        <span></span>
        <p>Or sign up with email</p>
        <span></span>
      </div><br>

      <form action="">
        <div class="input-box">
          <i class="bi bi-person-circle"></i>
          <input type="text" placeholder="Enter your username">
        </div><br>
        <div class="input-box">
          <i class="bi bi-envelope"></i>
          <input type="email" placeholder="Enter your E - mail">
        </div><br>
        <div class="input-box">
          <i class="bi bi-lock"></i>
          <input type="password" placeholder="Enter your password">
          <i class="bi bi-eye-slash "></i>
        </div><br>
        <div class="input-box">
          <i class="bi bi-lock"></i>
          <input type="password" placeholder="Confirm your password">
          <i class="bi bi-eye-slash"></i>
        </div><br>
        <div>
          <input type="checkbox">
          <label for="">Agree with <a href="#">Terms and conditions</a></label>
        </div><br>
        <div class="jj">
          <a href="log-in.html" class="btn-link">Sign up</a>
        </div>
      </form>
      <p class="t">Already have an account?<a href="log-in.html">Sign In</a></p>
    </div>
  </div>

  
</body>

</html>
